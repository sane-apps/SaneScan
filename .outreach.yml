# SaneScan Outreach Configuration

project:
  name: "SaneScan"
  url: "https://sanescan.saneapps.com"
  github: "sane-apps/SaneScan"
  tagline: "Private document scanning, OCR, and PDF export on iPhone and iPad."

positioning:
  one_liner: "Private iPhone/iPad document scanner with local OCR and PDF export."
  pricing: "Basic includes 10 scans per month. Pro is a $9.99/year StoreKit subscription for unlimited scans and batch import up to 50 images."
  privacy_claim: "Scans, OCR text, and exported PDFs stay on device unless the user explicitly shares or saves them elsewhere."
  avoid_claims:
    - "No data collection"
    - "Free unlimited scanning"
    - "Open source"

known_facts:
  - "SaneScan is App Store / StoreKit only; there is no external checkout, license key, or direct-download build."
  - "App Store Connect version 1.0 is READY_FOR_SALE and the public listing is live as of the June 2026 storefront checks."
  - "Simulator QA is green, but real-device VisionKit camera proof is blocked until a physical iPhone/iPad is connected and trusted on the Mini."
  - "App Store review contact metadata is present in .saneprocess; broad public launch is still gated on real-device VisionKit proof and exact public-copy approval."

search_keywords:
  - "private document scanner iPhone"
  - "iPhone OCR PDF scanner"
  - "document scanner no cloud"
  - "receipt scanner local OCR"
  - "CamScanner privacy alternative"

x_search_keywords:
  - "\"document scanner\" (privacy OR private OR \"no cloud\" OR local) iPhone lang:en -is:retweet"
  - "\"OCR\" \"PDF\" scanner iPhone lang:en -is:retweet"
  - "\"receipt scanner\" (privacy OR local OR iPhone) lang:en -is:retweet"
  - "\"CamScanner\" (alternative OR privacy) lang:en -is:retweet"

launches:
  - name: "SaneScan App Store 1.0"
    url: "https://apps.apple.com/us/app/sanescan/id6770391054"
    status: "live"
    starts: "2026-05-18"
    notes: "ASC version lane is READY_FOR_SALE and the public App Store listing is reachable; broad launch still depends on real-device VisionKit proof and exact public-copy approval."

launch_calendar:
  timezone: "America/New_York"
  classification: "app_store_live_launch_proof_pending"
  rule: "No Product Hunt, Hacker News, Indie Hackers, broad social push, or app-directory launch until real-device VisionKit proof and exact public-copy approval are complete."
  current_release_state:
    version: "1.0"
    build: "100"
    status: "live_app_store"
    evidence: "Mini ASC and public storefront checks on 2026-06-16 confirmed READY_FOR_SALE, public App Store URL HTTP 200, iTunes resultCount 1, and the live website CTA pointing at the production App Store URL."
  required_before_meaningful_launch:
    - "Capture real-device VisionKit scan proof on a trusted iPhone or iPad connected to the Mini."
    - "Show and approve exact public launch copy before any Product Hunt, Hacker News, Indie Hackers, directory, or broad social action."
  scheduled:
    - date: "2026-05-19"
      time: "10:00"
      channel: "App Store review follow-up"
      status: "completed_live_storefront_confirmed"
      action: "App Store Connect and public storefront checks confirmed version 1.0 is live; broad launch remains gated on real-device VisionKit proof and exact public-copy approval."
      gate: "Do not post broadly until real-device proof exists."
      success_metric: "ASC state, public URL, and website CTA recorded in SESSION_HANDOFF.md."
    - date: "2026-05-20"
      time: "10:00"
      channel: "Real-device VisionKit proof"
      status: "blocked_pending_device"
      action: "Connect and trust a physical iPhone/iPad on the Mini, run a real scan/import/export smoke test, and record screenshot/video proof."
      gate: "Physical device must be visible to `xcrun devicectl list devices`; simulator proof is not enough."
      success_metric: "Clean proof paths and device UDID recorded in outputs/qa_status.json."
      last_reviewed: "2026-06-19"
      result: "On 2026-06-19, canonical Mini `launch_readiness --json` reran from the repo root and still returned `ok: false`: real-device VisionKit proof is still missing, exact public launch copy still has not been approved, and the repo still has no `outputs/release_preflight_status.json` receipt, so `./scripts/SaneMaster.rb release_preflight` must run before any launch recommendation can turn green. No public launch, directory, or social action was executed."
  last_launch_readiness:
    date: "2026-06-19"
    status: "no_go_device_proof_pending"
    launch_readiness_exit: 1
    blocker_summary:
      - "Canonical Mini `launch_readiness --json` reran on 2026-06-19 and still exited nonzero."
      - "The App Store listing is live and the website CTA already points at the production App Store URL."
      - "Real-device VisionKit proof is still blocked until a trusted iPhone or iPad is attached to the Mini."
      - "Broad public-launch copy still needs exact user approval before posting."
      - "The repo still has no `outputs/release_preflight_status.json` receipt, so `./scripts/SaneMaster.rb release_preflight` must run before launch-readiness can clear."
      - "Run a fresh Mini `launch_readiness` after real-device proof is captured and a release_preflight receipt exists."
    next_date: "2026-06-26"

public_posting_policy:
  approval_required: true
  disclosure_required: "Always say 'I built SaneScan' when recommending it publicly."

